# Three identical, stateless app Pods behind one Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-app
spec:
  replicas: 3
  selector:
    matchLabels: {app: bank-app}
  template:
    metadata:
      labels: {app: bank-app}
    spec:
      containers:
        - name: app
          image: bank-app:1.0
          imagePullPolicy: Never   # image is built inside minikube's Docker
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: DB_HOST, value: bank-db}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: bank-secrets, key: DB_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: bank-secrets, key: JWT_SECRET}}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bank-app
spec:
  type: NodePort
  selector: {app: bank-app}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
