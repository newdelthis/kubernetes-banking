# Single PostgreSQL instance with a PVC: survives Pod replacement, but no replicas/failover/backups.
apiVersion: v1
kind: Secret
metadata:
  name: bank-secrets
stringData:
  DB_PASSWORD: bankpass
  JWT_SECRET: change-me-demo-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-db-init
data:
  init.sql: |
    CREATE TABLE users (
      username TEXT PRIMARY KEY,
      password TEXT NOT NULL
    );
    CREATE TABLE accounts (
      owner   TEXT PRIMARY KEY REFERENCES users(username),
      balance BIGINT NOT NULL CHECK (balance >= 0)
    );
    CREATE TABLE transfers (
      request_id TEXT PRIMARY KEY,
      from_owner TEXT NOT NULL,
      to_owner   TEXT NOT NULL,
      amount     BIGINT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    INSERT INTO users VALUES ('alice', 'alice123'), ('bob', 'bob123');
    INSERT INTO accounts VALUES ('alice', 10000), ('bob', 1000);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bank-db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: bank-db}
  template:
    metadata:
      labels: {app: bank-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_DB, value: bank}
            - {name: POSTGRES_USER, value: bank}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: bank-secrets, key: DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: [pg_isready, -U, bank, -d, bank]}
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: bank-db-data}
        - name: init
          configMap: {name: bank-db-init}
---
apiVersion: v1
kind: Service
metadata:
  name: bank-db
spec:
  selector: {app: bank-db}
  ports:
    - port: 5432
